          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: WORKER_WAKE_TOKEN
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: WORKER_WAKE_TOKEN
      - key: WORKER_1_URL
        sync: false
      - key: WORKER_2_URL
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: SOCIAL_PUBLISHER_DEFAULT
        value: ZERNIO
      - key: ZERNIO_API_BASE_URL
        value: https://zernio.com/api
      - key: ZERNIO_API_KEY
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: ZERNIO_API_KEY
      - key: ZERNIO_WEBHOOK_SECRET
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: ZERNIO_WEBHOOK_SECRET
      - key: ZERNIO_CONNECTION_RETURN_URL
        value: https://content-studio-5m7.pages.dev/content/connections
      - key: LINKEDIN_PUBLISH_WEBHOOK_URL
        sync: false
      - key: LINKEDIN_PUBLISH_WEBHOOK_SECRET
        sync: false
      - key: LINKEDIN_GENERATE_IMAGES
        value: "True"
      - key: LINKEDIN_IMAGE_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_BUCKET_NAME
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_ACCESS_KEY_ID
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_SECRET_ACCESS_KEY
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_ACCOUNT_ID
      - key: CLOUDFLARE_R2_PUBLIC_URL
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_PUBLIC_URL

  # ---------------------------------------------------------------------------
  # 4. Redis / Key Value Message Broker
  # ---------------------------------------------------------------------------
  - type: redis
    name: nomad-bot-redis
    plan: free
    ipAllowList: [] # internal access only
