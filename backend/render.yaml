services:
  # ---------------------------------------------------------------------------
  # 1. Django ASGI Web Application (HTTP & WebSockets via Daphne)
  # ---------------------------------------------------------------------------
  - type: web
    name: nomad-bot-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/run_web.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: nomad-bot-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: BILLING_SIMULATED_CHECKOUT_ENABLED
        sync: false
      - key: BILLING_SIMULATED_CHECKOUT_ALLOWED_EMAILS
        sync: false
      - key: BILLING_WEBHOOK_SECRET
        generateValue: true
      - key: WORKER_WAKE_TOKEN
        generateValue: true
      - key: WORKER_1_URL
        sync: false
      - key: WORKER_2_URL
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: CORS_ALLOWED_ORIGINS
        value: https://content-studio-5m7.pages.dev
      - key: CSRF_TRUSTED_ORIGINS
        value: https://content-studio-5m7.pages.dev
      - key: CONTENT_STUDIO_FRONTEND_ORIGINS
        value: https://content-studio-5m7.pages.dev
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: visiofytech@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "Visiofy Studio <visiofytech@gmail.com>"
      - key: SUPPORT_EMAIL
        value: visiofytech@gmail.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false

      - key: SOCIAL_PUBLISHER_DEFAULT
        value: ZERNIO
      - key: ZERNIO_API_BASE_URL
        value: https://zernio.com/api
      - key: ZERNIO_API_KEY
        sync: false
      - key: ZERNIO_WEBHOOK_SECRET
        sync: false
      - key: ZERNIO_CONNECTION_RETURN_URL
        value: https://content-studio-5m7.pages.dev/content/connections

      - key: LINKEDIN_PUBLISH_WEBHOOK_URL
        sync: false
      - key: LINKEDIN_PUBLISH_WEBHOOK_SECRET
        sync: false
      - key: LINKEDIN_GENERATE_IMAGES
        value: "True"
      - key: LINKEDIN_IMAGE_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Remote Celery Worker Service #1 (Dual-Process: Worker + Health Server)
  # ---------------------------------------------------------------------------
  - type: web
    name: nomad-bot-worker-1
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/run_worker.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WORKER_NAME
        value: worker-1
      - key: RUN_CELERY_BEAT
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: nomad-bot-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: WORKER_WAKE_TOKEN
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: WORKER_WAKE_TOKEN
      - key: WORKER_1_URL
        sync: false
      - key: WORKER_2_URL
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: SOCIAL_PUBLISHER_DEFAULT
        value: ZERNIO
      - key: ZERNIO_API_BASE_URL
        value: https://zernio.com/api
      - key: ZERNIO_API_KEY
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: ZERNIO_API_KEY
      - key: ZERNIO_WEBHOOK_SECRET
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: ZERNIO_WEBHOOK_SECRET
      - key: ZERNIO_CONNECTION_RETURN_URL
        value: https://content-studio-5m7.pages.dev/content/connections
      - key: LINKEDIN_PUBLISH_WEBHOOK_URL
        sync: false
      - key: LINKEDIN_PUBLISH_WEBHOOK_SECRET
        sync: false
      - key: LINKEDIN_GENERATE_IMAGES
        value: "True"
      - key: LINKEDIN_IMAGE_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_BUCKET_NAME
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_ACCESS_KEY_ID
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_SECRET_ACCESS_KEY
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_ACCOUNT_ID
      - key: CLOUDFLARE_R2_PUBLIC_URL
        fromService:
          type: web
          name: nomad-bot-web
          envVarKey: CLOUDFLARE_R2_PUBLIC_URL

  # ---------------------------------------------------------------------------
  # 3. Remote Celery Worker Service #2 (Dual-Process: Worker + Health Server)
  # ---------------------------------------------------------------------------
  - type: web
    name: nomad-bot-worker-2
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/run_worker.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WORKER_NAME
        value: worker-2
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
