name: Keep Render API awake

on:
  schedule:
    # Render free web services sleep after 15 minutes without inbound traffic.
    # Offset from the hour to reduce delays during busy scheduler boundaries.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      # Set the RENDER_BACKEND_URL repository variable to override this URL.
      BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://content-studio-wbb3.onrender.com' }}
    steps:
      - name: Ping API health endpoint
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 180 \
            "${BACKEND_URL%/}/health"
